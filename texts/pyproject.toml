[project]
name = "wvh-texts-mcp"
version = "0.2.0"
description = "Your text messages in Claude: read who you name, sweep only your list, and send only after you see it and say yes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WvH Hospitality LLC" }]
dependencies = [
    "mcp>=1.2.0,<2",  # 2.0 removed the low-level decorator API this server is written against
    "pyyaml>=6.0.1",
    "uvicorn>=0.30",  # the read-only door (remote.py); mcp already brings starlette
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
wvh-texts-mcp = "wvh_texts_mcp.server:main"
wvh-texts-setup = "wvh_texts_mcp.setup_cli:main"
wvh-texts-remote = "wvh_texts_mcp.remote:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
